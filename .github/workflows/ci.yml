name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "26"
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Test
        run: pnpm run test

  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "26"
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Run Vite+ check
        run: pnpm run check:dry
